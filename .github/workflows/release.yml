name: Release

# Builds a signed release APK and App Bundle.
#
# - Pushing a tag that starts with "v" (e.g. v1.0.0-final-poe) creates a GitHub Release for that tag
#   with the APK, the AAB, the R8 mapping file and docs/release-notes.md as the description.
# - Pushing to main builds the same files as a workflow artifact, so every merge is checked, but makes
#   no release.
#
# Signing: the build is signed with our upload key, stored as the RELEASE_* repository secrets and only
# written to the runner for the length of the job. Without the secrets (e.g. on a fork) the build is
# left unsigned, which still checks that R8 works, and no release is published.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed APK, bundle and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read the version from build.gradle.kts
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up the signing key
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            # The keystore only exists on the runner for this job and is never committed or uploaded.
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
            {
              echo "storeFile=$RUNNER_TEMP/upload-key.jks"
              echo "storePassword=$RELEASE_STORE_PASSWORD"
              echo "keyAlias=$RELEASE_KEY_ALIAS"
              echo "keyPassword=$RELEASE_KEY_PASSWORD"
            } > keystore.properties
            echo "key=upload" >> "$GITHUB_OUTPUT"
            echo "Signed with the Waypoint upload key (from repository secrets)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "key=none" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_* secrets are not set, so this build is unsigned and cannot be released."
            echo "Unsigned build: the RELEASE_* secrets are not set." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the signed APK and bundle
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Check the APK signature
        if: steps.signing.outputs.key == 'upload'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Name the files after the version
        run: |
          mkdir -p dist
          # Gradle names the APK app-release-unsigned.apk when there is no signing key.
          APK=$(ls app/build/outputs/apk/release/app-release*.apk | head -n 1)
          cp "$APK" "dist/waypoint-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/waypoint-${{ steps.version.outputs.name }}.aab"
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt "dist/waypoint-${{ steps.version.outputs.name }}-mapping.txt"
          fi

      - name: Upload the files as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.name }}-${{ steps.signing.outputs.key == 'upload' && 'signed' || 'unsigned' }}
          path: dist/*
          retention-days: 30

      # Releases only come from tags, so a release always matches an exact, tagged commit.
      - name: Create or update the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "${{ steps.signing.outputs.key }}" != "upload" ]; then
            echo "::error::Refusing to publish an unsigned release. Add the RELEASE_* secrets and re-run."
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file docs/release-notes.md
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --title "Waypoint ${{ steps.version.outputs.name }} (Final POE)" \
              --notes-file docs/release-notes.md
          fi
