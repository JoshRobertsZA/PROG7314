name: Release

# Builds a signed release bundle and publishes a GitHub Release when main changes.
# It signs with the throwaway key in ci/ (see ci/README.md), so no secrets are needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed bundle and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read the version from build.gradle.kts
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Point the build at the CI signing key
        run: |
          cat > keystore.properties <<PROPS
          storeFile=ci/ci-release.jks
          storePassword=waypoint-ci
          keyAlias=ci
          keyPassword=waypoint-ci
          PROPS

      - name: Build the signed release bundle
        run: ./gradlew bundleRelease --stacktrace

      - name: Name the files after the version
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/waypoint-${{ steps.version.outputs.name }}.aab"
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt "dist/waypoint-${{ steps.version.outputs.name }}-mapping.txt"
          fi

      - name: Upload the bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: waypoint-${{ steps.version.outputs.name }}
          path: dist/*
          retention-days: 30

      # A release is only made when this version has not been released before.
      # Bump versionName in app/build.gradle.kts for the next one.
      - name: Check whether the tag already exists
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the GitHub Release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --target "${{ github.sha }}" \
            --title "Waypoint ${{ steps.version.outputs.name }}" \
            --generate-notes

      - name: Explain when no release was made
        if: steps.tag.outputs.exists == 'true'
        run: echo "Tag ${{ steps.version.outputs.tag }} already exists, so no new release was created. Bump versionName to publish one."
